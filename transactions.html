<script>
function mostrarTransacciones() {

  let historial = obtenerHistorial();

  const section = document.querySelector("section");
  if (!section) return;

  if (historial.length === 0) {
    section.innerHTML = "<p>No hay movimientos registrados</p>";
    return;
  }

  let html = `<table class="table table-striped">
                <thead>
                  <tr>
                    <th>Tipo</th>
                    <th>Contacto</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                  </tr>
                </thead>
                <tbody>`;

  historial.forEach(tx => {
    html += `<tr>
               <td>${tx.tipo}</td>
               <td>${tx.contacto}</td>
               <td>${formatoPesosCLP(tx.monto)}</td>
               <td>${tx.fecha}</td>
             </tr>`;
  });

  html += `</tbody></table>`;

  section.innerHTML = html;
}
</script>

</body>
