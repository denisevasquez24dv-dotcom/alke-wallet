<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú | Alke Wallet</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <a class="navbar-brand" href="#">Alke Wallet</a>
  
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
      <li class="nav-item"><a class="nav-link" href="login.html">Cerrar sesión</a></li>
    </ul>
  </div>
</nav>

  <div class="container mt-4">

        <h1 class="text-primary mb-4">Menú principal</h1>

         <!-- Card de saldo -->
          <div class="card mb-4">
            <div class="card-body text-center">
                <h5 class="card-title">Saldo disponible</h5>
                <p class="h2 text-success" id="saldoDisplay">$10.000</p>
            </div>
        </div>

         <!-- Lista de opciones -->
             <ul class="list-group mb-3">
            <li class="list-group-item"><a href="deposit.html">Depositar dinero</a></li>
            <li class="list-group-item"><a href="sendmoney.html">Enviar dinero</a></li>
            <li class="list-group-item"><a href="transactions.html">Últimos movimientos</a></li>
        </ul>
        <!-- Cerrar sesión extra (opcional) -->
        <a href="login.html" class="btn btn-link">Cerrar sesión</a>

    </div>

    <!-- Scripts Bootstrap y dependencias -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>

      <!--Animación jQuery -->
      <script>
    $(document).ready(function() {
    
    $(".card").hide().fadeIn(600);

    $(".list-group").hide().slideDown(600);

    let saldo = Number(localStorage.getItem("saldo")) || 10000;
    $("#saldoDisplay").text(`$${saldo.toLocaleString()}`);
});
</script>
</body>
</html>
