<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Depósito | Alke Wallet</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

     <!-- Navbar responsive -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <a class="navbar-brand" href="menu.html">Alke Wallet</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-primary mb-4">Depositar dinero</h1>

        <form id="form-deposito">
            <div class="form-group">
                <label for="amount">Monto a depositar</label>
                <input type="number" class="form-control" id="amount" name="amount" required>
            </div>

            <button type="submit" class="btn btn-success">Realizar depósito</button>
        </form>
         <!-- Mensaje -->
        <div class="alert alert-success mt-3" id="mensaje" style="display:none;"></div>

        <a href="menu.html" class="btn btn-link mt-3">Volver al menú</a>
    </div>

   <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>

      <script>
 $(document).ready(function() {
    $("#form-deposito").submit(function(e) {
        e.preventDefault();
        const amount = Number($("#amount").val());
        if(amount <= 0) {
            $("#mensaje").removeClass("alert-success").addClass("alert-danger")
                .text("Ingrese un monto válido")
                .slideDown(300).delay(2000).slideUp(300);
            return;
        }

        // Actualizar saldo
        let saldo = Number(localStorage.getItem("saldo")) || 10000;
        saldo += amount;
        localStorage.setItem("saldo", saldo);

        // Guardar en historial
    let historial = obtenerHistorial();
  historial.push({
  tipo: "Depósito",
  contacto: "-",
  monto: amount,
  fecha: new Date().toLocaleString()
});

guardarHistorial(historial);

        // Mensaje de éxito
        $("#mensaje").removeClass("alert-danger").addClass("alert-success")
            .text(`Depósito exitoso: $${amount.toLocaleString()}. Saldo actual: $${saldo.toLocaleString()}`)
            .slideDown(300).delay(2000).slideUp(300);

        $("#amount").val("");
    });
});
    </script>


</body>
</html>
