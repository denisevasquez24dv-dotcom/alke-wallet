<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enviar Dinero | Alke Wallet</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar responsive -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <a class="navbar-brand" href="menu.html">Alke Wallet</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-primary mb-4">Enviar dinero</h1>

 <form id="form-envio">
     <div class="form-group">
      <label for="contact">Contacto</label>
      <input type="text" class="form-control" id="contact" name="contact" required>
    <ul class="list-group mt-1" id="listaSugerencias" style="display:none;"></ul>
    </div>

  <div class="form-group">
      <label for="amount">Monto a enviar</label>
      <input type="number" class="form-control" id="amount" name="amount" required>
  </div>

  <button type="submit" class="btn btn-success">Enviar</button>
 </form>
 <!-- Mensaje -->
        <div class="alert alert-success mt-3" id="mensaje" style="display:none;"></div>

        <a href="menu.html" class="btn btn-link mt-3">Volver al menú</a>
    </div>

   <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>

     <script>
    $(document).ready(function() {
        $("#form-envio").submit(function(e) {
            e.preventDefault();
            const contact = $("#contact").val();
            const amount = Number($("#amount").val());
            if(amount <= 0) {
                $("#mensaje").removeClass("alert-success").addClass("alert-danger")
                    .text("Ingrese un monto válido")
                    .slideDown(300).delay(2000).slideUp(300);
                return;
            }

            // Verificar saldo suficiente
            let saldo = Number(localStorage.getItem("saldo")) || 10000;
            if(amount > saldo) {
                $("#mensaje").removeClass("alert-success").addClass("alert-danger")
                    .text("Saldo insuficiente")
                    .slideDown(300).delay(2000).slideUp(300);
                return;
            }

            saldo -= amount;
            localStorage.setItem("saldo", saldo);

            // Guardar en historial
            let historial = JSON.parse(localStorage.getItem("historial")) || [];
            historial.push({
                tipo: "Envío",
                monto: amount,
                contacto: contact,
                fecha: new Date().toLocaleString()
            });
            localStorage.setItem("historial", JSON.stringify(historial));

            $("#mensaje").removeClass("alert-danger").addClass("alert-success")
                .text(`Se enviaron $${amount.toLocaleString()} a ${contact}. Saldo actual: $${saldo.toLocaleString()}`)
                .slideDown(300).delay(2000).slideUp(300);

            $("#amount").val("");
            $("#contact").val("");
        });
    });
    </script>

</body>
</html>
